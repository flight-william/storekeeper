# Commit hooks. Install with `pre-commit install`; house (from Homebrew, on PATH)
# runs the tools .house.toml names. Every hook checks, none rewrites.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: quality-gate
        name: quality gate (house check --stage commit)
        entry: house check --stage commit
        language: system
        pass_filenames: false
        always_run: true
